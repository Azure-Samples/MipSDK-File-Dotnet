name: Build and test

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-free:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            mip-package: Microsoft.InformationProtection.File
            runtime: win-x64
          - os: ubuntu-22.04
            mip-package: Microsoft.InformationProtection.File.Ubuntu2204
            runtime: linux-x64
          - os: ubuntu-24.04
            mip-package: Microsoft.InformationProtection.File.Ubuntu2404
            runtime: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MIPSDK_RUN_LIVE: "0"
      MipSdkPackage: ${{ matrix.mip-package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Install Ubuntu native prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if [[ "${{ matrix.os }}" == "ubuntu-24.04" ]]; then
            sudo apt-get install -y libgsf-1-114 libgmime-3.0-0t64 libsecret-1-0 libcurl4t64 libssl3t64 libuuid1 xdg-utils
          else
            sudo apt-get install -y libgsf-1-114 libgmime-3.0-0 libsecret-1-0 libcurl4 libssl3 libuuid1 xdg-utils
          fi
      - name: Restore with transitive advisory enforcement
        run: dotnet restore tests/mipsdk.Tests/mipsdk.Tests.csproj -p:MipSdkPackage=${{ matrix.mip-package }} -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror
      - name: Report dependency advisories
        run: |
          dotnet list src/mipsdk.csproj package --vulnerable --include-transitive --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet list tests/mipsdk.Tests/mipsdk.Tests.csproj package --vulnerable --include-transitive --no-restore
      - name: Build
        run: dotnet build tests/mipsdk.Tests/mipsdk.Tests.csproj --configuration Release --no-restore -p:MipSdkPackage=${{ matrix.mip-package }} -warnaserror
      - name: Test, native loading, and managed branch coverage
        run: dotnet test --project tests/mipsdk.Tests/mipsdk.Tests.csproj --configuration Release --no-build -p:MipSdkPackage=${{ matrix.mip-package }} --coverlet --coverlet-include "[mipsdk]*" --coverlet-output-format cobertura --coverlet-threshold 80 --coverlet-threshold-type branch --results-directory artifacts/coverage
      - name: Publish
        run: dotnet publish src/mipsdk.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained false --output artifacts/publish -p:MipSdkPackage=${{ matrix.mip-package }} -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror
      - name: Published help
        run: dotnet artifacts/publish/mipsdk.dll --help
      - name: Published native smoke
        run: dotnet artifacts/publish/mipsdk.dll --native-smoke
      - name: Published blank configuration must fail before sign-in
        run: |
          dotnet artifacts/publish/mipsdk.dll --check-config
          if ($LASTEXITCODE -ne 2) { throw "Expected configuration validation to return exit code 2." }
          $global:LASTEXITCODE = 0
      - name: Upload credential-free coverage only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: artifacts/coverage/*.xml
          if-no-files-found: error
          retention-days: 7
